
<div class="login-page">

  <div class="login-card">

    <!-- Brand Section -->
    <div class="brand-section">
      <div class="brand-icon">C</div>

      <h2>CRM Portal</h2>

      <p>Manage your leads. Grow your business.</p>
    </div>

    <!-- Login Form Section -->
    <div class="form-section">

      <h3>Welcome Back!</h3>

      <p class="subtitle">
        Please sign in to your account
      </p>

      <form
        (ngSubmit)="onLogin()"
        #loginForm="ngForm"
        novalidate>

        <!-- Email -->
        <div class="mb-3">

          <label for="email" class="form-label">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="Enter your email"
            [(ngModel)]="email"
            required
            email
            autocomplete="email"
            #emailInput="ngModel"
            [disabled]="isLoading"
          />

          <small
            class="error"
            *ngIf="emailInput.invalid && emailInput.touched">

            <span *ngIf="emailInput.errors?.['required']">
              Email address is required.
            </span>

            <span *ngIf="emailInput.errors?.['email']">
              Please enter a valid email address.
            </span>

          </small>

        </div>

        <!-- Password -->
        <div class="mb-3">

          <label for="password" class="form-label">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
            #passwordInput="ngModel"
            [disabled]="isLoading"
          />

          <small
            class="error"
            *ngIf="passwordInput.invalid && passwordInput.touched">

            Password is required.

          </small>

        </div>

        <!-- Backend Error Message -->
        <div
          class="error-message"
          role="alert"
          *ngIf="errorMessage">

          {{ errorMessage }}

        </div>

        <!-- Login Button -->
        <button
          type="submit"
          class="btn login-btn w-100"
          [disabled]="loginForm.invalid || isLoading">

          {{ isLoading ? 'Signing in...' : 'Sign In' }}

        </button>

      </form>

      <!-- Signup Navigation -->
      <p class="signup-text">

        Don't have an account?

        <a routerLink="/signup">
          Sign Up
        </a>

      </p>

      <!-- Footer -->
      <p class="footer-text">
        Secure access to your CRM workspace
      </p>

    </div>

  </div>

</div>
