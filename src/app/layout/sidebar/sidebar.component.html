<!-- MOBILE MENU BUTTON -->
<button
  type="button"
  class="mobile-menu-toggle"
  (click)="toggleMobileMenu()"
  aria-label="Toggle menu">
  ☰
</button>

<!-- MOBILE OVERLAY -->
<button
  type="button"
  class="mobile-menu-backdrop"
  [class.visible]="isMobileMenuOpen"
  (click)="closeMobileMenu()"
  aria-label="Close menu">
</button>
<aside class="sidebar" [class.mobile-open]="isMobileMenuOpen">

  <!-- SIDEBAR BRAND -->
  <div class="sidebar-brand">

    <div class="brand-logo">
      <img
        src="assets/logo1.jpeg"
        alt="Company Logo"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      />

      <span class="fallback-logo" style="display: none;">
        C
      </span>
    </div>

    <h2>CRM Portal</h2>

  </div>

  <div class="menu-label">WORKSPACE</div>

  <!-- SIDEBAR MENU -->
 <nav class="sidebar-menu" (click)="closeMobileMenu()">

    <a routerLink="/dashboard"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }"
       class="menu-item">
      <span class="menu-icon">📊</span>
      Dashboard
    </a>

    <a routerLink="/my-organization"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">🏢</span>
      My Organization
    </a>
   <a routerLink="/location-tracking"
   routerLinkActive="active"
   class="menu-item">
  <span class="menu-icon">📍</span>
  Live Location Tracking
</a>
    <a routerLink="/leads"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">📋</span>
      Leads
    </a>

    <a routerLink="/sales-users"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">👥</span>
      Sales Users
    </a>

    <a routerLink="/customers"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">🤝</span>
      Customers
    </a>

    <a routerLink="/deals"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">💼</span>
      Deals
    </a>

    <a routerLink="/campaigns"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">📢</span>
      Campaigns
    </a>

    <!-- COMMUNICATION -->

<a routerLink="/announcements"
   routerLinkActive="active"
   class="menu-item">
  <span class="menu-icon">📢</span>
  Announcements
</a>

<a routerLink="/chat"
   routerLinkActive="active"
   class="menu-item">
  <span class="menu-icon">💬</span>
  Private Chat
</a>

    <!-- TODAY'S ACTIONS -->
    <a routerLink="/todays-actions"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">⚡</span>
      Today's Actions
    </a>

    <a routerLink="/follow-ups"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">📞</span>
      Follow-ups
    </a>

    <a routerLink="/tasks"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">✅</span>
      Tasks
    </a>

    <a routerLink="/quotations"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">📄</span>
      Quotations
    </a>

    <a routerLink="/documents"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">📁</span>
      Documents
    </a>

    <a routerLink="/reports"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">📈</span>
      Reports
    </a>

    <a routerLink="/settings"
       routerLinkActive="active"
       class="menu-item">
      <span class="menu-icon">⚙️</span>
      Settings
    </a>

  </nav>

  <!-- SIDEBAR FOOTER -->
  <div class="sidebar-footer">

    <button
      type="button"
      (click)="logout()"
      class="logout-btn">

      <span class="menu-icon">🚪</span>
      Logout

    </button>

  </div>

</aside>
