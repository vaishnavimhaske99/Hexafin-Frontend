<aside class="sidebar">
  
  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-icon">C</div>
    <div class="brand-text">
      <h2>CRM Portal</h2>
      <p>Manager Workspace</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <p class="nav-group-title">WORKSPACE</p>

    <a routerLink="/manager-dashboard" 
       routerLinkActive="active" 
       class="nav-item">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Dashboard</span>
    </a>

    <a routerLink="/my-organization" 
       routerLinkActive="active" 
       class="nav-item">
      <span class="nav-icon">🏢</span>
      <span class="nav-label">My Organization</span>
    </a>

    <a routerLink="/leads" 
       routerLinkActive="active" 
       class="nav-item">
      <span class="nav-icon">📋</span>
      <span class="nav-label">Leads</span>
    </a>

    <a routerLink="/customers" 
       routerLinkActive="active" 
       class="nav-item">
      <span class="nav-icon">👥</span>
      <span class="nav-label">Customers</span>
    </a>

    <p class="nav-group-title">TOOLS</p>

    <a routerLink="/sales-users" 
       routerLinkActive="active" 
       class="nav-item">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Sales Users</span>
    </a>

    <a routerLink="/reports" 
       routerLinkActive="active" 
       class="nav-item">
      <span class="nav-icon">📈</span>
      <span class="nav-label">Reports</span>
    </a>

  </nav>

  <!-- Footer — User Info -->
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar">
        {{ userName.charAt(0).toUpperCase() }}
      </div>
      <div class="user-info">
        <p class="user-name">{{ userName }}</p>
        <p class="user-role">Manager</p>
      </div>
      <button class="logout-btn" (click)="logout()" title="Logout">
        🚪
      </button>
    </div>
  </div>

</aside>
